<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="218" viewBox="0 0 1080 218" role="img" aria-labelledby="title desc">
  <title id="title">Dynanotch layout around the physical camera notch</title>
  <desc id="desc">The AirPods bubble is on the left, the charging pill is on the right, and the compact music surface surrounds the physical camera notch. Album art and waveform sit on either side of the camera cutout.</desc>
  <rect width="1080" height="218" rx="20" fill="#202832"/>
  <path d="M96 55h888" stroke="#66778a" stroke-width="2"/>
  <text x="96" y="39" fill="#c5d4e5" font-family="sans-serif" font-size="17">Top of the display</text>

  <path d="M240 55h600q-16 0-16 16v36q0 26-26 26H282q-26 0-26-26V71q0-16-16-16" fill="#080a0d"/>
  <rect x="172" y="61" width="66" height="66" rx="33" fill="#080a0d"/>
  <circle cx="205" cy="94" r="25" fill="none" stroke="#35d56b" stroke-width="5"/>
  <path d="M196 84q-8 0-8 7t8 7v9h5V88q0-4-5-4zm18 0q8 0 8 7t-8 7v9h-5V88q0-4 5-4z" fill="#edf3fa"/>
  <rect x="840" y="61" width="112" height="66" rx="33" fill="#080a0d"/>
  <rect x="857" y="75" width="70" height="37" rx="13" fill="#35d56b"/>
  <path d="M928 87q12 0 12 7t-12 7z" fill="#35d56b"/>
  <path d="m894 79-12 17h10l-5 12 16-17h-11z" fill="#0b2514"/>
  <rect x="267" y="68" width="54" height="54" rx="12" fill="#156e81"/>
  <circle cx="294" cy="91" r="13" fill="#71e5e5"/>
  <path d="M267 99h54v6h-54zm0 10h54v5h-54z" fill="#10394e"/>
  <path d="M768 91v6m8-12v18m8-15v12m8-17v22m8-17v12m8-9v6" fill="none" stroke="#71e5e5" stroke-width="3" stroke-linecap="round"/>

  <path d="M332 55h416v53q0 22-22 22H354q-22 0-22-22z" fill="#28354b" stroke="#a6c8ff" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="540" cy="77" r="4" fill="#a6c8ff"/>
  <text x="540" y="105" text-anchor="middle" fill="#edf4ff" font-family="sans-serif" font-size="18" font-weight="bold">Physical camera notch</text>
  <path d="M205 135v20m89-20v20m494-20v20m108-20v20" stroke="#8193a9" stroke-width="2"/>
  <g text-anchor="middle" fill="#edf3fa" font-family="sans-serif" font-size="16">
    <text x="205" y="180">AirPods</text>
    <text x="294" y="180">Artwork</text>
    <text x="788" y="180">Waveform</text>
    <text x="905" y="180">Charging</text>
    <text x="540" y="180" fill="#a6c8ff">No app content in the cutout</text>
  </g>
</svg>
